<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokédex</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #e3350d;
    --red-dark: #b02b0a;
    --red-light: #ff6b4a;
    --yellow: #ffcb05;
    --yellow-dark: #e0b000;
    --black: #1a1a2e;
    --dark: #16213e;
    --card-bg: #0f3460;
    --card-border: #1a4a80;
    --white: #f0f0f0;
    --gray: #8899aa;
    --screen-green: #a8ff78;

    /* type colors */
    --fire: #fd7d24; --water: #4592c4; --grass: #9bcc50;
    --electric: #eed535; --psychic: #f366b9; --ice: #51c4e7;
    --dragon: #7038f8; --dark-type: #707070; --fairy: #fdb9e9;
    --normal: #a4acaf; --fighting: #d56723; --poison: #b97fc9;
    --ground: #f7de3f; --flying: #3dc7ef; --bug: #729f3f;
    --rock: #a38c21; --ghost: #7b62a3; --steel: #9eb7b8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    font-family: 'Nunito', sans-serif;
    color: var(--white);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── BACKGROUND ── */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(227,53,13,.15) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(255,203,5,.08) 0%, transparent 50%),
      repeating-linear-gradient(
        0deg, transparent, transparent 60px,
        rgba(255,255,255,.02) 60px, rgba(255,255,255,.02) 61px
      ),
      repeating-linear-gradient(
        90deg, transparent, transparent 60px,
        rgba(255,255,255,.02) 60px, rgba(255,255,255,.02) 61px
      );
    pointer-events: none;
  }

  /* ── BANNER ── */
  .banner {
    position: relative; z-index: 1;
    background: linear-gradient(135deg, var(--red-dark) 0%, var(--red) 50%, var(--red-light) 100%);
    padding: 0;
    overflow: hidden;
    border-bottom: 4px solid var(--yellow);
    box-shadow: 0 4px 30px rgba(0,0,0,.5);
  }

  .banner::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 10% 50%, rgba(255,255,255,.08) 0%, transparent 40%),
      radial-gradient(circle at 90% 50%, rgba(0,0,0,.2) 0%, transparent 40%);
  }

  .banner-inner {
    max-width: 1400px;
    margin: 0 auto;
    padding: 28px 40px;
    display: flex;
    align-items: center;
    gap: 24px;
    position: relative;
  }

  .pokeball-icon {
    width: 70px; height: 70px;
    flex-shrink: 0;
    animation: spin-slow 8s linear infinite;
  }

  @keyframes spin-slow { to { transform: rotate(360deg); } }

  .banner-text h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(1.1rem, 3vw, 2rem);
    color: var(--yellow);
    text-shadow: 3px 3px 0 var(--red-dark), 0 0 20px rgba(255,203,5,.4);
    letter-spacing: 2px;
    line-height: 1.3;
  }

  .banner-text p {
    margin-top: 8px;
    font-size: 0.9rem;
    color: rgba(255,255,255,.75);
    font-weight: 600;
  }

  .banner-dots {
    margin-left: auto;
    display: flex; gap: 10px; align-items: center;
  }

  .banner-dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.4);
    animation: pulse-dot 1.8s ease-in-out infinite;
  }
  .banner-dot:nth-child(1) { background: #ff6b6b; animation-delay: 0s; }
  .banner-dot:nth-child(2) { background: #ffd93d; animation-delay: .3s; }
  .banner-dot:nth-child(3) { background: #6bcb77; animation-delay: .6s; }

  @keyframes pulse-dot {
    0%,100% { transform: scale(1); opacity: .7; }
    50% { transform: scale(1.3); opacity: 1; }
  }

  /* ── CONTROLS ── */
  .controls {
    position: relative; z-index: 1;
    max-width: 1400px;
    margin: 32px auto 0;
    padding: 0 24px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
  }

  .search-group {
    display: flex;
    flex: 1;
    min-width: 260px;
    max-width: 500px;
    gap: 0;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid var(--card-border);
    transition: border-color .2s;
    box-shadow: 0 4px 20px rgba(0,0,0,.3);
  }

  .search-group:focus-within { border-color: var(--red); }

  .search-input {
    flex: 1;
    background: var(--dark);
    color: var(--white);
    border: none; outline: none;
    padding: 14px 18px;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 600;
  }

  .search-input::placeholder { color: var(--gray); }

  .btn-search {
    background: var(--red);
    color: var(--white);
    border: none;
    padding: 14px 22px;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    transition: background .2s, transform .1s;
    white-space: nowrap;
  }

  .btn-search:hover { background: var(--red-dark); }
  .btn-search:active { transform: scale(.97); }

  .filter-select {
    background: var(--dark);
    color: var(--white);
    border: 2px solid var(--card-border);
    border-radius: 12px;
    padding: 14px 18px;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    outline: none;
    transition: border-color .2s;
    box-shadow: 0 4px 20px rgba(0,0,0,.3);
    min-width: 170px;
  }

  .filter-select:focus { border-color: var(--red); }
  .filter-select option { background: var(--dark); }

  .results-info {
    margin-left: auto;
    font-size: 0.85rem;
    color: var(--gray);
    font-weight: 600;
    background: var(--dark);
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid var(--card-border);
  }

  /* ── GRID ── */
  .grid-container {
    position: relative; z-index: 1;
    max-width: 1400px;
    margin: 28px auto 60px;
    padding: 0 24px;
  }

  .pokemon-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 20px;
  }

  /* ── CARD ── */
  .poke-card {
    background: linear-gradient(145deg, var(--card-bg), var(--dark));
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 20px 16px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s;
    animation: card-in .4s ease both;
  }

  @keyframes card-in {
    from { opacity: 0; transform: translateY(20px) scale(.95); }
    to   { opacity: 1; transform: translateY(0)   scale(1); }
  }

  .poke-card:hover {
    transform: translateY(-8px) scale(1.03);
    box-shadow: 0 16px 40px rgba(0,0,0,.5), 0 0 20px rgba(255,203,5,.1);
    border-color: var(--yellow);
    z-index: 2;
  }

  .poke-card::before {
    content: '';
    position: absolute; top: -40%; left: -40%;
    width: 80%; height: 80%;
    background: radial-gradient(circle, rgba(255,255,255,.06) 0%, transparent 70%);
    transition: opacity .3s;
    opacity: 0;
  }
  .poke-card:hover::before { opacity: 1; }

  .poke-card::after {
    content: '';
    position: absolute; bottom: -30px; right: -30px;
    width: 100px; height: 100px;
    border-radius: 50%;
    border: 20px solid rgba(255,255,255,.03);
  }

  .poke-id {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.55rem;
    color: var(--gray);
    align-self: flex-start;
  }

  .poke-img-wrap {
    width: 110px; height: 110px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }

  .poke-img-wrap::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.06) 0%, transparent 70%);
  }

  .poke-img {
    width: 100%; height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,.5));
    transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  }

  .poke-card:hover .poke-img { transform: scale(1.15) translateY(-4px); }

  .poke-name {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.6rem;
    color: var(--white);
    text-align: center;
    text-transform: capitalize;
    line-height: 1.5;
  }

  .poke-types {
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
  }

  .type-badge {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: rgba(255,255,255,.95);
    text-shadow: 0 1px 2px rgba(0,0,0,.5);
  }

  /* ── LOADING ── */
  .loading {
    grid-column: 1 / -1;
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    padding: 80px 0;
    color: var(--gray);
  }

  .pokeball-loading {
    width: 60px; height: 60px;
    animation: pokeball-spin 1s linear infinite;
  }

  @keyframes pokeball-spin { to { transform: rotate(360deg); } }

  .loading p {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.7rem;
    color: var(--gray);
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── ERROR / EMPTY ── */
  .message {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
  }
  .message h3 {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.9rem;
    color: var(--red-light);
    margin-bottom: 12px;
  }
  .message p { color: var(--gray); font-size: 0.95rem; }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,.8);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity .25s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: linear-gradient(160deg, #1a2a4a, #0f1f38);
    border: 2px solid var(--card-border);
    border-radius: 28px;
    padding: 40px;
    max-width: 560px;
    width: 100%;
    position: relative;
    transform: scale(.9) translateY(20px);
    transition: transform .3s cubic-bezier(.34,1.56,.64,1);
    box-shadow: 0 30px 80px rgba(0,0,0,.7);
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-overlay.open .modal { transform: scale(1) translateY(0); }

  .modal-close {
    position: absolute; top: 16px; right: 16px;
    background: var(--card-bg); border: none; color: var(--gray);
    width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer; font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
    transition: color .2s, background .2s;
  }
  .modal-close:hover { color: var(--white); background: var(--red); }

  .modal-header { display: flex; gap: 24px; align-items: center; margin-bottom: 28px; }

  .modal-img-wrap {
    width: 130px; height: 130px; flex-shrink: 0;
    background: radial-gradient(circle, rgba(255,255,255,.07), transparent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }

  .modal-img { width: 120px; height: 120px; object-fit: contain; image-rendering: pixelated; }

  .modal-info h2 {
    font-family: 'Press Start 2P', monospace;
    font-size: 1rem;
    text-transform: capitalize;
    color: var(--yellow);
    text-shadow: 0 0 20px rgba(255,203,5,.3);
    margin-bottom: 6px;
  }
  .modal-info .modal-id { color: var(--gray); font-size: 0.8rem; font-weight: 700; }
  .modal-types { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  .modal-section { margin-bottom: 20px; }
  .modal-section h3 {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.6rem;
    color: var(--gray);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .stat-row {
    display: flex; align-items: center; gap: 12px; margin-bottom: 8px;
  }
  .stat-name { width: 100px; font-size: 0.8rem; font-weight: 700; color: var(--gray); text-transform: uppercase; font-size: 0.7rem; }
  .stat-val { width: 38px; text-align: right; font-weight: 900; font-size: 0.9rem; color: var(--white); }
  .stat-bar-track { flex: 1; height: 8px; background: rgba(255,255,255,.1); border-radius: 4px; overflow: hidden; }
  .stat-bar-fill {
    height: 100%; border-radius: 4px;
    background: linear-gradient(90deg, var(--red), var(--yellow));
    transition: width .8s cubic-bezier(.22,1,.36,1);
    width: 0%;
  }

  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .detail-item {
    background: rgba(255,255,255,.05);
    border-radius: 12px;
    padding: 12px 16px;
  }
  .detail-item label { font-size: 0.65rem; color: var(--gray); font-weight: 700; text-transform: uppercase; display: block; margin-bottom: 4px; }
  .detail-item span { font-size: 1rem; font-weight: 900; color: var(--white); }

  .abilities-list { display: flex; gap: 8px; flex-wrap: wrap; }
  .ability-tag {
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: capitalize;
    color: var(--screen-green);
  }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--black); }
  ::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--red); }

  /* type bg map */
  .t-fire    { background: var(--fire); }
  .t-water   { background: var(--water); }
  .t-grass   { background: var(--grass); }
  .t-electric{ background: var(--electric); color: #333; }
  .t-psychic { background: var(--psychic); }
  .t-ice     { background: var(--ice); }
  .t-dragon  { background: var(--dragon); }
  .t-dark    { background: var(--dark-type); }
  .t-fairy   { background: var(--fairy); color: #333; }
  .t-normal  { background: var(--normal); color: #333; }
  .t-fighting{ background: var(--fighting); }
  .t-poison  { background: var(--poison); }
  .t-ground  { background: var(--ground); color: #333; }
  .t-flying  { background: var(--flying); }
  .t-bug     { background: var(--bug); }
  .t-rock    { background: var(--rock); }
  .t-ghost   { background: var(--ghost); }
  .t-steel   { background: var(--steel); color: #333; }

  @media (max-width: 600px) {
    .banner-inner { padding: 20px; }
    .controls { gap: 10px; }
    .search-group { min-width: 100%; max-width: 100%; }
    .results-info { display: none; }
    .modal { padding: 24px; }
    .modal-header { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<!-- BANNER -->
<header class="banner">
  <div class="banner-inner">
    <svg class="pokeball-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="48" fill="white" stroke="black" stroke-width="3"/>
      <path d="M2 50 Q2 2 50 2 Q98 2 98 50" fill="#e3350d"/>
      <rect x="2" y="47" width="96" height="6" fill="black"/>
      <circle cx="50" cy="50" r="14" fill="black"/>
      <circle cx="50" cy="50" r="10" fill="white"/>
      <circle cx="50" cy="50" r="6" fill="white" stroke="black" stroke-width="2"/>
    </svg>
    <div class="banner-text">
      <h1>POKÉDEX</h1>
      <p>Explore todos os Pokémons da região!</p>
    </div>
    <div class="banner-dots">
      <div class="banner-dot"></div>
      <div class="banner-dot"></div>
      <div class="banner-dot"></div>
    </div>
  </div>
</header>

<!-- CONTROLS -->
<div class="controls">
  <div class="search-group">
    <input class="search-input" id="searchInput" type="text" placeholder="Nome ou ID... ex: pikachu, 25">
    <button class="btn-search" id="searchBtn">🔍 Buscar</button>
  </div>
  <select class="filter-select" id="typeFilter">
    <option value="">Todos os Tipos</option>
    <option value="normal">Normal</option>
    <option value="fire">Fogo 🔥</option>
    <option value="water">Água 💧</option>
    <option value="grass">Planta 🌿</option>
    <option value="electric">Elétrico ⚡</option>
    <option value="ice">Gelo ❄️</option>
    <option value="fighting">Lutador 🥊</option>
    <option value="poison">Veneno ☠️</option>
    <option value="ground">Terra 🌍</option>
    <option value="flying">Voador 🦅</option>
    <option value="psychic">Psíquico 🔮</option>
    <option value="bug">Inseto 🐛</option>
    <option value="rock">Pedra 🪨</option>
    <option value="ghost">Fantasma 👻</option>
    <option value="dragon">Dragão 🐉</option>
    <option value="dark">Sombrio 🌑</option>
    <option value="steel">Aço ⚙️</option>
    <option value="fairy">Fada 🧚</option>
  </select>
  <div class="results-info" id="resultsInfo">Carregando...</div>
</div>

<!-- GRID -->
<div class="grid-container">
  <div class="pokemon-grid" id="pokeGrid">
    <div class="loading">
      <svg class="pokeball-loading" viewBox="0 0 100 100" fill="none">
        <circle cx="50" cy="50" r="48" fill="white" stroke="#333" stroke-width="3"/>
        <path d="M2 50 Q2 2 50 2 Q98 2 98 50" fill="#e3350d"/>
        <rect x="2" y="47" width="96" height="6" fill="#333"/>
        <circle cx="50" cy="50" r="14" fill="#333"/>
        <circle cx="50" cy="50" r="10" fill="white"/>
        <circle cx="50" cy="50" r="6" fill="white" stroke="#333" stroke-width="2"/>
      </svg>
      <p>Carregando Pokémons...</p>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
const BASE = 'https://pokeapi.co/api/v2';
const TOTAL = 151;
let allPokemon = [];
let filtered  = [];

const grid      = document.getElementById('pokeGrid');
const info      = document.getElementById('resultsInfo');
const typeFilter= document.getElementById('typeFilter');
const searchIn  = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const overlay   = document.getElementById('modalOverlay');
const modalClose= document.getElementById('modalClose');
const modalContent = document.getElementById('modalContent');

const typeClass = t => ({
  dark: 't-dark', fire:'t-fire', water:'t-water', grass:'t-grass',
  electric:'t-electric', psychic:'t-psychic', ice:'t-ice', dragon:'t-dragon',
  fairy:'t-fairy', normal:'t-normal', fighting:'t-fighting', poison:'t-poison',
  ground:'t-ground', flying:'t-flying', bug:'t-bug', rock:'t-rock',
  ghost:'t-ghost', steel:'t-steel'
})[t] || 't-normal';

const statLabel = s => ({
  hp:'HP', attack:'ATK', defense:'DEF',
  'special-attack':'SP.ATK', 'special-defense':'SP.DEF', speed:'VEL'
})[s] || s;

async function fetchPokemon(id) {
  const r = await fetch(`${BASE}/pokemon/${id}`);
  if (!r.ok) throw new Error('not found');
  return r.json();
}

async function loadAll() {
  const promises = [];
  for (let i = 1; i <= TOTAL; i++) promises.push(fetchPokemon(i));
  const results = await Promise.allSettled(promises);
  allPokemon = results
    .filter(r => r.status === 'fulfilled')
    .map(r => r.value);
  filtered = [...allPokemon];
  renderGrid(filtered);
}

function renderGrid(list) {
  if (!list.length) {
    grid.innerHTML = `<div class="message"><h3>Nenhum resultado</h3><p>Tente outro nome, ID ou tipo.</p></div>`;
    info.textContent = '0 Pokémons';
    return;
  }
  info.textContent = `${list.length} Pokémons`;
  grid.innerHTML = list.map((p, i) => cardHTML(p, i)).join('');
  grid.querySelectorAll('.poke-card').forEach(card => {
    card.addEventListener('click', () => openModal(+card.dataset.id));
  });
}

function cardHTML(p, i) {
  const types = p.types.map(t => `<span class="type-badge ${typeClass(t.type.name)}">${t.type.name}</span>`).join('');
  const img = p.sprites.other?.['official-artwork']?.front_default
           || p.sprites.front_default
           || `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png`;
  return `
    <div class="poke-card" data-id="${p.id}" style="animation-delay:${Math.min(i * 30, 600)}ms">
      <span class="poke-id">#${String(p.id).padStart(3,'0')}</span>
      <div class="poke-img-wrap">
        <img class="poke-img" src="${img}" alt="${p.name}" loading="lazy">
      </div>
      <span class="poke-name">${p.name}</span>
      <div class="poke-types">${types}</div>
    </div>`;
}

async function openModal(id) {
  overlay.classList.add('open');
  modalContent.innerHTML = '<div class="loading"><svg class="pokeball-loading" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="48" fill="white" stroke="#333" stroke-width="3"/><path d="M2 50 Q2 2 50 2 Q98 2 98 50" fill="#e3350d"/><rect x="2" y="47" width="96" height="6" fill="#333"/><circle cx="50" cy="50" r="14" fill="#333"/><circle cx="50" cy="50" r="10" fill="white"/><circle cx="50" cy="50" r="6" fill="white" stroke="#333" stroke-width="2"/></svg></div>';
  try {
    const p = await fetchPokemon(id);
    const img = p.sprites.other?.['official-artwork']?.front_default || p.sprites.front_default;
    const types = p.types.map(t => `<span class="type-badge ${typeClass(t.type.name)}">${t.type.name}</span>`).join('');
    const stats = p.stats.map(s => {
      const pct = Math.min(Math.round(s.base_stat / 255 * 100), 100);
      return `<div class="stat-row">
        <span class="stat-name">${statLabel(s.stat.name)}</span>
        <span class="stat-val">${s.base_stat}</span>
        <div class="stat-bar-track"><div class="stat-bar-fill" data-pct="${pct}" style="width:0%"></div></div>
      </div>`;
    }).join('');
    const abilities = p.abilities.map(a =>
      `<span class="ability-tag">${a.ability.name.replace('-',' ')}</span>`).join('');

    modalContent.innerHTML = `
      <div class="modal-header">
        <div class="modal-img-wrap"><img class="modal-img" src="${img}" alt="${p.name}"></div>
        <div class="modal-info">
          <h2>${p.name}</h2>
          <div class="modal-id">#${String(p.id).padStart(3,'0')}</div>
          <div class="modal-types">${types}</div>
        </div>
      </div>
      <div class="modal-section">
        <h3>Detalhes</h3>
        <div class="detail-grid">
          <div class="detail-item"><label>Altura</label><span>${(p.height/10).toFixed(1)} m</span></div>
          <div class="detail-item"><label>Peso</label><span>${(p.weight/10).toFixed(1)} kg</span></div>
          <div class="detail-item"><label>Exp. Base</label><span>${p.base_experience ?? '—'}</span></div>
          <div class="detail-item"><label>Espécies</label><span style="text-transform:capitalize">${p.species.name}</span></div>
        </div>
      </div>
      <div class="modal-section">
        <h3>Habilidades</h3>
        <div class="abilities-list">${abilities}</div>
      </div>
      <div class="modal-section">
        <h3>Estatísticas Base</h3>
        ${stats}
      </div>`;

    // animate bars after render
    requestAnimationFrame(() => {
      modalContent.querySelectorAll('.stat-bar-fill').forEach(bar => {
        setTimeout(() => { bar.style.width = bar.dataset.pct + '%'; }, 100);
      });
    });
  } catch {
    modalContent.innerHTML = `<div class="message"><h3>Erro!</h3><p>Não foi possível carregar as informações.</p></div>`;
  }
}

function closeModal() { overlay.classList.remove('open'); }
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
modalClose.addEventListener('click', closeModal);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── SEARCH ──
async function doSearch() {
  const q = searchIn.value.trim().toLowerCase();
  if (!q) {
    filtered = typeFilter.value
      ? allPokemon.filter(p => p.types.some(t => t.type.name === typeFilter.value))
      : [...allPokemon];
    renderGrid(filtered);
    return;
  }

  // try local first
  const local = allPokemon.find(p => p.name === q || String(p.id) === q);
  if (local) {
    renderGrid([local]);
    return;
  }

  // fetch from API
  grid.innerHTML = '<div class="loading"><svg class="pokeball-loading" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="48" fill="white" stroke="#333" stroke-width="3"/><path d="M2 50 Q2 2 50 2 Q98 2 98 50" fill="#e3350d"/><rect x="2" y="47" width="96" height="6" fill="#333"/><circle cx="50" cy="50" r="14" fill="#333"/><circle cx="50" cy="50" r="10" fill="white"/><circle cx="50" cy="50" r="6" fill="white" stroke="#333" stroke-width="2"/></svg><p>Buscando...</p></div>';
  try {
    const p = await fetchPokemon(q);
    renderGrid([p]);
  } catch {
    grid.innerHTML = `<div class="message"><h3>Não encontrado</h3><p>Pokémon "<strong>${q}</strong>" não foi encontrado.</p></div>`;
    info.textContent = '0 Pokémons';
  }
}

searchBtn.addEventListener('click', doSearch);
searchIn.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

// ── FILTER ──
typeFilter.addEventListener('change', () => {
  const type = typeFilter.value;
  const src  = searchIn.value.trim() ? filtered : allPokemon;
  filtered = type ? src.filter(p => p.types.some(t => t.type.name === type)) : [...allPokemon];
  renderGrid(filtered);
});

// ── INIT ──
loadAll();
</script>
</body>
</html>
